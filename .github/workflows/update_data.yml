name: "Automated Matchweek Data Refresh"

on:
  schedule:
    # Runs every Monday at 04:00 UTC (after weekend fixtures conclude)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    name: Ingest, Clean, and Validate Premier League Data
    runs-on: ubuntu-latest

    steps:
      - name: Step 1: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Step 2: Set up Python 3.11 environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Step 3: Cache pip packages and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 4: Run Data Ingestion Script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.PL_API_KEY }}
        run: |
          python data_ingestion/fetch_api_data.py

      - name: Step 5: Run Data Cleaning Pipeline
        run: |
          python data_ingestion/clean_pipeline.py

      - name: Step 6: Execute Data Ingestion Test Suite
        run: |
          python -m pytest tests/test_data_ingestion.py -v

      - name: Step 7: Commit updated datasets back to main branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated weekly Premier League matchday refresh [skip ci]"
          file_pattern: "data/processed/cleaned_players.csv data/processed/cleaned_matches.csv data/raw/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
